<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Progress Report</title>
<style>
:root{--green:#1f6f3f;--green2:#2e8b57;--yellow:#f6c915;--ink:#1d2421;--muted:#6b756f;--line:#e3e8e4;--bg:#f4f6f2;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 12px 32px}
.top{position:relative;background:var(--green);color:#fff;padding:22px 18px 18px;border-bottom:6px solid var(--yellow);border-radius:0 0 14px 14px;margin:0 -12px 16px}
.school{font-size:14px;opacity:.9;letter-spacing:.02em}
.top h1{margin:6px 0 8px;font-size:28px;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.meta span{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:999px}
.print{position:absolute;top:16px;right:14px;background:var(--yellow);color:var(--ink);border:0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 14px 6px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:19px;color:var(--green);border-left:5px solid var(--yellow);padding-left:9px}
.card h3{margin:10px 0 2px;font-size:15px;color:var(--green2)}
.card p{margin:0 0 10px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.lbl{flex:1;font-size:14px}
.code{color:var(--green)}
.qs{display:flex;gap:5px;flex:none}
.q{display:flex;flex-direction:column;align-items:center;gap:2px}
.ql{font-size:10px;color:var(--muted)}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 4px;border-radius:8px;font-weight:700;font-size:15px;font-style:normal}
.s0{background:#f1f3f1;color:#9aa39d}
.s1{background:#fde2e1;color:#a3261f}
.s2{background:#fff0d6;color:#9a5a00}
.s3{background:#e6f4d9;color:#3f6b12}
.s4{background:#c9ecd3;color:#11612f}
.sx{background:#e8eef9;color:#244a8f;font-size:13px}
.sn{background:#eef2ef;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding-bottom:8px;font-size:14px}
.legend span{display:flex;align-items:center;gap:7px}
.legend .sc{min-width:28px;height:28px;font-size:14px}
.ir{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
.ir th,.ir td{padding:7px 6px;border-top:1px solid var(--line);text-align:center}
.ir th:first-child{text-align:left;font-weight:600}
.ir tr:first-child th{border-top:0;color:var(--muted);font-weight:600}
.sub{margin:14px 0 2px;padding-top:8px;border-top:2px solid var(--line);font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.card h2+.sub{border-top:0;margin-top:0;padding-top:0}
.muted{color:var(--muted)}
.msg{margin-top:40px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
@media (max-width:560px){.row{flex-direction:column;align-items:stretch;gap:8px}
.qs{justify-content:flex-start}
.top h1{font-size:24px}
.print{display:none}
}
@media print{body{background:#fff}
.print{display:none}
.top{border-radius:0}
.card{break-inside:avoid;box-shadow:none}
}

.loading{margin-top:60px;text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div class="spin"></div>Loading report card...</div>
</div>
<script>
// This page stores no student information. It asks the teacher's report card
// spreadsheet for one student's card, using the private code in the link.
// Only report card spreadsheets listed here can be shown on this page.
var ALLOWED = [
  "AKfycbwSa0xTM6R42p--cI2Xjvk_K5OucZ7vN9iez_eodcfPkBcRNfsEbK1Zn7yY4sqd6kuxow"  // Messer
];
(function () {
  var app = document.getElementById("app");
  function fail() {
    app.innerHTML = '<div class="card msg"><h2>This link is not working</h2>' +
      "<p>Please contact your child's teacher for a new report card link.</p></div>";
  }
  var p = new URLSearchParams(location.search);
  var d = p.get("d") || "", s = p.get("s") || "";
  if (ALLOWED.indexOf(d) < 0 || !/^[a-f0-9]{40,}$/.test(s)) { fail(); return; }
  var url = "https://script.google.com/macros/s/" + d + "/exec?format=json&s=" + encodeURIComponent(s);
  fetch(url, { credentials: "omit", cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) { fail(); return; }
      document.title = j.title || "Progress Report";
      app.innerHTML = j.html;
    })
    .catch(fail);
})();
</script>
</body>
</html>
